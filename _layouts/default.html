<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    {% include head.html %}
</head>
<body>
    <div class="blackthemeBox">
        {% include header.html %}

        <main id="main-content">
            {{ content }}
        </main>

        <footer>
            <div class="blackthemeCode">
                <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} - تمامی حقوق محفوظ است.</p>
            </div>
        </footer>
    </div>

    <!-- Background Overlay Backdrop for Mobile/Sidebar -->
    <div class="blackthemeOverlay"></div>

    <!-- Slide-out Navigation Drawer -->
    {% include sidebar.html %}

    <!-- Toast Notification for Copy Link -->
    <div id="toast-notification" class="toast-notification" aria-live="polite">
        <span>لینک نوشته با موفقیت کپی شد!</span>
    </div>

    <!-- Main Theme Script -->
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
