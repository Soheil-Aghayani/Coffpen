# Site Configuration for Coffpen Blog
title: کاف‌پن (Coffpen) | سیاه و قلم
description: وبلاگ شخصی سهیل آقایانی برای داستان‌های کوتاه فارسی، مجموعه‌های داستانی و دل‌نوشته‌ها.
url: "https://soheil-aghayani.github.io"
baseurl: "/Coffpen"

author:
  name: سهیل آقایانی
  bio: نویسنده و توسعه‌دهنده وب؛ نویسنده داستان‌های کوتاه فارسی و دل‌نوشته‌ها در کاف‌پن.
  email: info@coffpen.com
  avatar: https://s6.uupload.ir/files/untitled-2_3s5m.jpg

# Header Banner
header_image: /assets/images/social-preview.jpg

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /post/:title/

# Plugins natively supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation Links
navigation:
  - title: خانه
    url: /
    icon: home
  - title: درباره من
    url: /about/
    icon: profile
  - title: تماس
    url: /contact/
    icon: email
  - title: مدیریت
    url: /admin/
    icon: edit

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
