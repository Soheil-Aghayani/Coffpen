# Site Configuration for Coffpen Blog
title: کاف پـن
description: یادداشت‌ها، داستان‌ها و نوشته‌های کاف پن
url: "https://coffpen.github.io" # Update with your GitHub username: https://<username>.github.io
baseurl: "" # Keep empty if deploying to username.github.io, or set to "/repo-name" if in a project repo

author:
  name: کاف پن
  bio: نویسنده و پژوهشگر. یادداشت‌هایی درباره زندگی، کلمات و داستان‌ها.
  email: info@coffpen.com
  avatar: https://s6.uupload.ir/files/untitled-2_3s5m.jpg

# Header Banner
header_image: https://s6.uupload.ir/files/untitled-2_3s5m.jpg

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /post/:title/

# Plugins natively supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation Links
navigation:
  - title: خانه
    url: /
    icon: home
  - title: درباره من
    url: /about/
    icon: profile
  - title: تماس
    url: /contact/
    icon: email
  - title: مدیریت
    url: /admin/
    icon: edit

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
