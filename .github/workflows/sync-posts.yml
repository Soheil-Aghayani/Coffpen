name: Sync static posts

on:
  push:
    branches:
      - main
    paths:
      - "posts/**/*.html"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate shared post registry
        run: node scripts/sync-posts.js
      - name: Commit updated registry
        run: |
          if git diff --quiet -- posts/posts-data.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/posts-data.js
          git commit -m "Sync published posts"
          git push
